
services:
  db:
    image: postgres:17-alpine
    container_name: estamparia-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estamparia

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estamparia"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: