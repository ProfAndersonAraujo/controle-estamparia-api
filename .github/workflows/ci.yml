
name: CI - Controle de Estamparia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estamparia_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d estamparia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5433/estamparia_test?schema=public

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      - name: Executar migrations
        run: npx prisma migrate deploy

      - name: Verificar qualidade do codigo
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Verificar cobertura
        run: npm run coverage

      - name: Compilar projeto
        run: npm run build